<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 198" width="980" height="198" role="img" aria-label="Vigía PPE: per-person review with NVIDIA AI">
<style>
    .bg{fill:#ffffff} .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5} .t{fill:#1f2328;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
    .s{fill:#59636e;font:12.5px system-ui,-apple-system,'Segoe UI',sans-serif} .ttl{fill:#59636e;font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.08em}
    .ar{stroke:#afb8c1;stroke-width:2;fill:none} .ah{fill:#afb8c1}
    .flow{stroke:#ffb020;stroke-width:3;fill:none;stroke-dasharray:6 14;animation:dash 1.1s linear infinite}
    .hl{fill:none;stroke:#ffb020;stroke-width:2.5;opacity:0;animation:pulse 6.0s ease-in-out infinite}
    .tagnv{fill:#76b900} .tagweb{fill:#0969da} .tagedge{fill:#bc4c00} .tagt{fill:#fff;font:700 10px ui-monospace,Consolas,monospace}
    .num{fill:#ffb020;font:800 13px ui-monospace,Consolas,monospace}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @keyframes pulse{0%,3.0%{opacity:0}7.0%{opacity:1}19.0%{opacity:1}25.0%,100%{opacity:0}}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117} .box{fill:#161b22;stroke:#30363d} .t{fill:#e6edf3} .s,.ttl{fill:#9198a1} .ar{stroke:#484f58} .ah{fill:#484f58}}
    @media (prefers-reduced-motion:reduce){.flow,.hl{animation:none} .hl{opacity:1}}
    </style>
<rect class="bg" width="980" height="198" rx="12"/>
<text class="ttl" x="20" y="28">VIGÍA PPE: PER-PERSON REVIEW WITH NVIDIA AI</text>
<rect class="box" x="20.0" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="20.0" y="46" width="160.8" height="112" rx="10" style="animation-delay:0.00s"/>
<text class="num" x="34.0" y="70">01</text>
<rect class="tagweb" x="111.4" y="57" width="59.4" height="17" rx="4"/>
<text class="tagt" x="116.4" y="69.5">BROWSER</text>
<text class="t" x="34.0" y="98">Photo, camera</text>
<text class="t" x="34.0" y="116">or screen</text>
<text class="s" x="34.0" y="138">phone, PC or a</text>
<text class="s" x="34.0" y="154">YouTube video</text>
<path class="ar" d="M183.8 102.0 H208.8"/><path class="flow" d="M183.8 102.0 H206.8"/>
<path class="ah" d="M212.8 102.0 l-8 -5 v10 z"/>
<rect class="box" x="214.8" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="214.8" y="46" width="160.8" height="112" rx="10" style="animation-delay:1.20s"/>
<text class="num" x="228.8" y="70">02</text>
<text class="t" x="228.8" y="98">Sector</text>
<text class="s" x="228.8" y="120">the PPE list lives</text>
<text class="s" x="228.8" y="136">on the server</text>
<path class="ar" d="M378.6 102.0 H403.6"/><path class="flow" d="M378.6 102.0 H401.6"/>
<path class="ah" d="M407.6 102.0 l-8 -5 v10 z"/>
<rect class="box" x="409.6" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="409.6" y="46" width="160.8" height="112" rx="10" style="animation-delay:2.40s"/>
<text class="num" x="423.6" y="70">03</text>
<rect class="tagnv" x="508.2" y="57" width="52.2" height="17" rx="4"/>
<text class="tagt" x="513.2" y="69.5">NVIDIA</text>
<text class="t" x="423.6" y="98">Nemotron VL</text>
<text class="s" x="423.6" y="120">each person, each</text>
<text class="s" x="423.6" y="136">item, their task</text>
<path class="ar" d="M573.4 102.0 H598.4"/><path class="flow" d="M573.4 102.0 H596.4"/>
<path class="ah" d="M602.4 102.0 l-8 -5 v10 z"/>
<rect class="box" x="604.4" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="604.4" y="46" width="160.8" height="112" rx="10" style="animation-delay:3.60s"/>
<text class="num" x="618.4" y="70">04</text>
<rect class="tagweb" x="695.8" y="57" width="59.4" height="17" rx="4"/>
<text class="tagt" x="700.8" y="69.5">BROWSER</text>
<text class="t" x="618.4" y="98">PPE matrix</text>
<text class="s" x="618.4" y="120">worn, missing,</text>
<text class="s" x="618.4" y="136">misused or not visible</text>
<path class="ar" d="M768.2 102.0 H793.2"/><path class="flow" d="M768.2 102.0 H791.2"/>
<path class="ah" d="M797.2 102.0 l-8 -5 v10 z"/>
<rect class="box" x="799.2" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="799.2" y="46" width="160.8" height="112" rx="10" style="animation-delay:4.80s"/>
<text class="num" x="813.2" y="70">05</text>
<rect class="tagweb" x="890.6" y="57" width="59.4" height="17" rx="4"/>
<text class="tagt" x="895.6" y="69.5">BROWSER</text>
<text class="t" x="813.2" y="98">Report</text>
<text class="s" x="813.2" y="120">risk, action and</text>
<text class="s" x="813.2" y="136">unsafe conditions</text>
</svg>