<rect class="tagedge" x="320.6" y="57" width="45.0" height="17" rx="4"/>
<text class="tagt" x="325.6" y="69.5">LOCAL</text>
<text class="t" x="228.8" y="98">Detector</text>
<text class="s" x="228.8" y="120">custom YOLOv8</text>
<text class="s" x="228.8" y="136">ONNX + WebGPU</text>
<path class="ar" d="M378.6 102.0 H403.6"/><path class="flow" d="M378.6 102.0 H401.6"/>
<path class="ah" d="M407.6 102.0 l-8 -5 v10 z"/>
<rect class="box" x="409.6" y="46" width="160.8" height="112" rx="10"/>
