<text class="tagt" x="520.4" y="69.5">LOCAL</text>
<text class="t" x="423.6" y="98">Privacy</text>
<text class="s" x="423.6" y="120">faces blurred</text>
<text class="s" x="423.6" y="136">before saving</text>
<path class="ar" d="M573.4 102.0 H598.4"/><path class="flow" d="M573.4 102.0 H596.4"/>
<path class="ah" d="M602.4 102.0 l-8 -5 v10 z"/>
<rect class="box" x="604.4" y="46" width="160.8" height="112" rx="10"/>
<rect class="hl" x="604.4" y="46" width="160.8" height="112" rx="10" style="animation-delay:3.60s"/>
<text class="num" x="618.4" y="70">04</text>
<rect class="tagedge" x="710.2" y="57" width="45.0" height="17" rx="4"/>
<text class="tagt" x="715.2" y="69.5">LOCAL</text>
<text class="t" x="618.4" y="98">Alert</text>
<text class="s" x="618.4" y="120">photo to the</text>
<text class="s" x="618.4" y="136">supervisor in seconds</text>
<path class="ar" d="M768.2 102.0 H793.2"/><path class="flow" d="M768.2 102.0 H791.2"/>
<path class="ah" d="M797.2 102.0 l-8 -5 v10 z"/>
<rect class="box" x="799.2" y="46" width="160.8" height="112" rx="10"/>
