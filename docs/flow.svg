<rect class="tagedge" x="905.0" y="57" width="45.0" height="17" rx="4"/>
<text class="tagt" x="910.0" y="69.5">LOCAL</text>
<text class="t" x="813.2" y="98">Report</text>
<text class="s" x="813.2" y="120">compliance by</text>
